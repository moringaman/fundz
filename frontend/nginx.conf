server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # All API calls go directly to the backend via the shared axios instance
    # (api.ts), which uses the absolute VITE_API_URL.  No nginx proxy needed.
    # This location only serves the SPA — everything else is direct.
    location / {
        try_files $uri $uri/ /index.html;
    }
}